name: Select published catalog

on:
  workflow_call:
    inputs:
      modules-tag:
        description: Catalog tag, or empty to select published catalog.
        type: string
        default: ''
    outputs:
      modules-tag:
        value: ${{ jobs.metadata.outputs.modules-tag }}

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      modules-tag: ${{ steps.catalog.outputs.modules-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: limanix/modules
          fetch-depth: 0
          path: .cache/modules
          persist-credentials: false
      - name: Select published catalog
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES_TAG: ${{ inputs.modules-tag }}
        run: >-
          python3 -B .github/scripts/select_catalog.py --modules-root .cache/modules
          --modules-tag "$MODULES_TAG" >> "$GITHUB_OUTPUT"
      - name: Summarize selected catalog
        env:
          CATALOG_TAG: ${{ steps.catalog.outputs.modules-tag }}
          CATALOG_SHA: ${{ steps.catalog.outputs.catalog-commit-sha }}
        run: |
          {
            printf '## Published catalog\n\n'
            printf -- '- Release: `%s`\n' "$CATALOG_TAG"
            printf -- '- Catalog commit: `%s`\n' "$CATALOG_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
