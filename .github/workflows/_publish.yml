name: Publish release

on:
  workflow_call:
    inputs:
      evaluation-matrix:
        description: Complete pair matrix from release metadata; empty plans it here.
        type: string
        default: ''
      commit-sha:
        description: Client source commit SHA.
        required: true
        type: string
      release-tag:
        description: Client tag to publish.
        required: true
        type: string
      modules-tag:
        description: Verified module catalog tag.
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_checks.yml
    with:
      modules-tag: ${{ inputs.modules-tag }}
      commit-sha: ${{ inputs.commit-sha }}

  contract:
    uses: ./.github/workflows/_eval.yml
    with:
      evaluation-matrix: ${{ inputs.evaluation-matrix }}
      modules-tag: ${{ inputs.modules-tag }}
      commit-sha: ${{ inputs.commit-sha }}

  build:
    uses: ./.github/workflows/_build.yml
    with:
      artifact-name: limanix-bin-${{ inputs.release-tag }}
      release-tag: ${{ inputs.release-tag }}
      modules-tag: ${{ inputs.modules-tag }}
      commit-sha: ${{ inputs.commit-sha }}

  docs:
    name: Prepare docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
      - name: Prepare doc sources
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          command: docs/prepare RELEASE_TAG="$RELEASE_TAG"
      - name: Package docs
        run: tar -czf build/docs.tar.gz -C build/docs .
      - name: Upload docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-docs-${{ inputs.release-tag }}
          path: build/docs.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Create GitHub release
    if: ${{ always() && !cancelled() }}
    needs: [build, docs, check, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every publication check
        uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.build.outputs.artifact-name }}-*
          merge-multiple: true
          path: bin
      - name: Download docs archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-docs-${{ inputs.release-tag }}
          path: build
      - name: Create release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: limanix
          repositories: client
          permission-contents: write
          permission-workflows: write
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.release-token.outputs.token }}
          tag_name: ${{ inputs.release-tag }}
          target_commitish: ${{ inputs.commit-sha }}
          name: ${{ inputs.release-tag }}
          body: |
            Client source: `${{ inputs.commit-sha }}`
            Module catalog: [${{ inputs.modules-tag }}](https://github.com/limanix/modules/releases/tag/${{ inputs.modules-tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: legacy
          files: |
            bin/*
            build/docs.tar.gz
