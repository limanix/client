name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modules:
    uses: ./.github/workflows/_metadata.yml
    with:
      profile: pr

  go:
    needs: modules
    uses: ./.github/workflows/_checks.yml
    permissions:
      contents: read
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}

  build:
    needs: modules
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}

  contract:
    needs: modules
    uses: ./.github/workflows/_eval.yml
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}
      evaluation-matrix: ${{ needs.modules.outputs.matrix }}

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: docs/prepare

  gate:
    if: always()
    needs: [modules, go, build, contract, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
