name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ fromJSON(steps.tags.outputs.tags)[0].tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: limanix/modules
          fetch-depth: 0
          persist-credentials: false
      - uses: mr-chelyshkin/actions/get-tags@v1
        id: tags
        with:
          repository: limanix/modules
          pattern: '^v[1-9][0-9]*$'
          require-release: 'true'
          count: '1'
      - name: Report selected module release
        env:
          MODULES_TAG: ${{ fromJSON(steps.tags.outputs.tags)[0].tag }}
        run: |
          test -n "$MODULES_TAG"
          printf '## Modules\n\nSelected release: [limanix/modules %s](https://github.com/limanix/modules/releases/tag/%s)\n' \
            "$MODULES_TAG" "$MODULES_TAG" >> "$GITHUB_STEP_SUMMARY"

  go:
    needs: modules
    uses: mr-chelyshkin/actions/.github/workflows/pr-golang.yml@v1
    permissions:
      contents: read
    with:
      environment: modules_version=${{ needs.modules.outputs.tag }}
      cache-path: .cache/go
      cache-key-prefix: limanix-go-v1
      cache-dependency-path: '**/go.sum'

  build:
    name: limanix
    needs: [modules, go]
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      modules-tag: ${{ needs.modules.outputs.tag }}

  gate:
    if: always()
    needs: [modules, go, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
