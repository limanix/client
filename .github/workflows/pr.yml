name: PR flow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: ci/markdown/fmt

  modules:
    name: Published catalog
    uses: ./.github/workflows/_metadata.yml

  go:
    name: Go checks
    needs: modules
    uses: ./.github/workflows/_checks.yml
    permissions:
      contents: read
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}

  build:
    name: macOS builds
    needs: modules
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

  contract:
    name: Generated NixOS
    needs: modules
    uses: ./.github/workflows/_eval.yml
    with:
      modules-tag: ${{ needs.modules.outputs.modules-tag }}

  gate:
    if: always()
    needs: [markdown, modules, go, build, contract]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: mr-chelyshkin/actions/job-results-check@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          results: ${{ toJSON(needs) }}
