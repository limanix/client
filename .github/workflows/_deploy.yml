name: Deploy

on:
  workflow_call:
    inputs:
      source-tag:
        description: Client source tag.
        required: true
        type: string
      commit-sha:
        description: Client source commit SHA.
        required: true
        type: string
      release-tag:
        description: Prepared version to build and publish.
        required: true
        type: string
      preparation-error:
        description: Preparation failure for this version; other versions can proceed.
        required: false
        type: string
      modules-tag:
        description: Verified module catalog tag.
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # Use this workflow's automation even when rebuilding an older client commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check client tag format
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          tag: ${{ inputs.source-tag }}
          pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[1-9][0-9]*)?$'
      - name: Check client tag branch
        uses: mr-chelyshkin/actions/check-tag-branch@v1
        with:
          tag: ${{ inputs.source-tag }}
          branch: main
      - name: Verify source and release commits
        env:
          SOURCE_TAG: ${{ inputs.source-tag }}
          SOURCE_SHA: ${{ inputs.commit-sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PREPARATION_ERROR: ${{ inputs.preparation-error }}
        run: python3 scripts/release.py verify

  build:
    needs: verify
    uses: ./.github/workflows/_build.yml
    with:
      commit-sha: ${{ inputs.commit-sha }}
      release-tag: ${{ inputs.release-tag }}
      modules-tag: ${{ inputs.modules-tag }}
      artifact-name: limanix-bin-${{ inputs.release-tag }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: bin
      - name: Create client release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: limanix
          repositories: client
          permission-contents: write
          permission-workflows: write
      - name: Publish the client release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.release-token.outputs.token }}
          tag_name: ${{ inputs.release-tag }}
          target_commitish: ${{ inputs.commit-sha }}
          name: ${{ inputs.release-tag }}
          body: |
            Client source: `${{ inputs.commit-sha }}`
            Module catalog: [${{ inputs.modules-tag }}](https://github.com/limanix/modules/releases/tag/${{ inputs.modules-tag }})
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: 'false'
          files: bin/*
      - name: Record the published docs versions
        env:
          CLIENT_TAG: ${{ inputs.release-tag }}
          MODULES_TAG: ${{ inputs.modules-tag }}
        run: python3 scripts/release.py receipt
      - name: Upload the published docs versions
        uses: actions/upload-artifact@v7
        with:
          name: docs-release-${{ inputs.release-tag }}
          path: ${{ runner.temp }}/docs-release-${{ inputs.release-tag }}.json
          if-no-files-found: error
          overwrite: true
