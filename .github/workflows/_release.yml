name: Release

on:
  workflow_call:
    inputs:
      client-tag:
        description: New client source tag; empty for a module catalog event.
        required: false
        type: string
      modules-tag:
        description: New module catalog tag; empty for a client tag push.
        required: false
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: limanix-release
  queue: max

permissions:
  contents: read

env:
  RELEASE_COUNT: '3'
  MODULES_TAG_FORMAT: '^v[1-9][0-9]*$'
  CLIENT_TAG_PATTERN: 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  select:
    name: Prepare release versions
    runs-on: ubuntu-24.04
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      modules-tag: ${{ steps.modules.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the module catalog
        id: modules
        env:
          CLIENT_TAG: ${{ inputs.client-tag }}
          MODULES_TAG: ${{ inputs.modules-tag }}
        run: python3 scripts/release.py modules
      - name: Check module tag format
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          tag: ${{ steps.modules.outputs.tag }}
          pattern: ${{ env.MODULES_TAG_FORMAT }}
      - name: Verify the module release
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES_TAG: ${{ steps.modules.outputs.tag }}
        run: python3 scripts/release.py verify-modules
      - name: Select published client versions
        if: inputs.modules-tag != ''
        id: tags
        uses: mr-chelyshkin/actions/get-tags@v1
        with:
          pattern: ${{ env.CLIENT_TAG_PATTERN }}
          count: ${{ env.RELEASE_COUNT }}
          ignore-build-metadata: 'true'
          require-release: 'true'
          sort: desc
      - name: Prepare the release matrix
        id: plan
        env:
          CLIENT_TAG: ${{ inputs.client-tag }}
          MODULES_TAG: ${{ steps.modules.outputs.tag }}
          TAGS: ${{ steps.tags.outputs.tags || '[]' }}
        run: python3 scripts/release.py plan

  release:
    name: Release ${{ matrix.source_tag }}
    needs: select
    if: needs.select.outputs.releases != '[]' && needs.select.outputs.releases != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.releases) }}
    uses: ./.github/workflows/_deploy.yml
    with:
      source-tag: ${{ matrix.source_tag }}
      commit-sha: ${{ matrix.commit_sha }}
      release-tag: ${{ matrix.release_tag }}
      preparation-error: ${{ matrix.error }}
      modules-tag: ${{ needs.select.outputs.modules-tag }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  finalize:
    name: Finalize release
    needs: [select, release]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.release.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: mr-chelyshkin/actions/get-tags@v1
        id: latest
        with:
          require-release: 'true'
          pattern: ${{ env.CLIENT_TAG_PATTERN }}
      - name: Mark the highest published version as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ steps.latest.outputs.tags }}
        run: python3 scripts/release.py latest
      - name: Download the published docs versions
        uses: actions/download-artifact@v8
        with:
          pattern: docs-release-*
          path: ${{ runner.temp }}/docs-releases
          merge-multiple: true
      - name: Prepare the client release event
        id: docs-event
        run: python3 scripts/release.py docs-event
      - name: Create docs access token
        if: steps.docs-event.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          repositories: docs
          owner: limanix
      - name: Send client release event
        if: steps.docs-event.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh api --method POST repos/limanix/docs/dispatches
          --input "$RUNNER_TEMP/docs-event.json"
