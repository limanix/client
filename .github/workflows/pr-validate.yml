name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-label:
    if: &regular-pr >-
      !(vars.RELEASE_APP_SLUG != '' &&
        github.actor == format('{0}[bot]', vars.RELEASE_APP_SLUG) &&
        github.event.pull_request.user.login == format('{0}[bot]', vars.RELEASE_APP_SLUG) &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'deps/limanix-modules/'))
    name: check label
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-changelog-label@v1

  go:
    if: *regular-pr
    uses: mr-chelyshkin/actions/.github/workflows/pr-golang.yml@v1
    permissions:
      contents: read
    with:
      cache-path: .cache/go
      cache-key-prefix: limanix-go-v1
      cache-dependency-path: '**/go.sum'

  limanix-build:
    name: limanix
    needs: go
    uses: ./.github/workflows/build-limanix.yml
    permissions:
      contents: read

  gate:
    if: always() && needs.check-label.result != 'skipped'
    needs: [check-label, go, limanix-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
