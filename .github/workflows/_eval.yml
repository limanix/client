name: NixOS generation

on:
  workflow_call:
    inputs:
      modules-tag:
        description: Catalog used by the default VM smoke check.
        type: string
        required: true
      commit-sha:
        description: Client source to evaluate.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  evaluate:
    name: Generated NixOS — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            name: AMD64
            runner: ubuntu-24.04
          - arch: arm64
            name: ARM64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha || github.sha }}
          persist-credentials: false
      - name: Restore compiler and Nix source caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go
            .cache/nix
          key: nixos-v2-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ inputs.modules-tag }}-${{ github.sha }}
          restore-keys: |
            nixos-v2-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ inputs.modules-tag }}-
            nixos-v2-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
      - name: Prepare Nix cache permissions
        run: |
          mkdir -p .cache/nix
          sudo chown -R 0:0 .cache/nix
      - name: Check client fixtures and default VM configuration
        uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: ci/nix/eval
          args: |
            modules_version=${{ inputs.modules-tag }}
            EVAL_ARCH=${{ matrix.arch }}
      - name: Restore Nix cache ownership
        if: always()
        run: |
          if [ -d .cache/nix ]; then
            sudo chown -R "$(id -u):$(id -g)" .cache/nix
          fi
      - name: Summarize NixOS generation checks
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
          CLIENT_REF: ${{ inputs.commit-sha || github.sha }}
          CATALOG_TAG: ${{ inputs.modules-tag }}
          GUEST_ARCH: ${{ matrix.name }}
          GUEST_ARCH_ID: ${{ matrix.arch }}
        run: |
          source_sha=$(git rev-parse --verify HEAD 2>/dev/null || printf '%s' "$CLIENT_REF")
          {
            printf '## NixOS generation — %s\n\n' "$GUEST_ARCH"
            printf 'Runs the selected client revision’s generated-configuration tests.\n\n'
            printf 'Current tests cover synthetic client fixtures and config.Default() with the published catalog. This is Nix evaluation, without building or booting a VM. Older client releases run their own test scenarios.\n\n'
            printf -- '- Task: `ci/nix/eval EVAL_ARCH=%s`\n' "$GUEST_ARCH_ID"
            printf -- '- Client commit: `%s`\n' "$source_sha"
            printf -- '- Catalog: `%s`\n' "$CATALOG_TAG"
            printf -- '- Status: `%s`\n' "$CHECK_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
