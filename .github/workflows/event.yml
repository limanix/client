name: Event flow

on:
  repository_dispatch:
    types: [limanix-modules-release]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      modules-tag: ${{ github.event.client_payload.tag }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
