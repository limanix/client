name: Go checks

on:
  workflow_call:
    inputs:
      modules-tag:
        description: Catalog tag used by the test fixture.
        type: string
        required: true
      commit-sha:
        description: Client source to check.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: ci/golang/fmt
            name: Go formatting
            purpose: Check formatting in cmd/ and internal/.
          - task: ci/golang/lint
            name: Go lint
            purpose: Run Go lint checks.
          - task: ci/golang/test
            name: Go tests — race detector
            purpose: Run Go tests with the race detector.
          - task: ci/golang/audit
            name: Go vulnerability scan
            purpose: Scan Go code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha || github.sha }}
          persist-credentials: false
      - name: Restore Go compilation and download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/go
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ hashFiles('go.sum') }}-
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-
      - name: Restore verified guest-agent fixtures
        if: matrix.task == 'ci/golang/test'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            internal/bundle/resources/*.gz
            internal/bundle/resources/manifest.json
          key: guest-agent-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Taskfile.yml', 'internal/bundle/generator/**', 'internal/bundle/vmnetgen/**') }}
      - name: ${{ matrix.name }}
        uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: ${{ matrix.task }}
          args: modules_version=${{ inputs.modules-tag }}
      - name: Summarize Go check
        if: always()
        env:
          CHECK_NAME: ${{ matrix.name }}
          CHECK_PURPOSE: ${{ matrix.purpose }}
          CHECK_TASK: ${{ matrix.task }}
          CHECK_PLATFORM: ${{ runner.os }} / ${{ runner.arch }}
          CHECK_STATUS: ${{ job.status }}
          CLIENT_REF: ${{ inputs.commit-sha || github.sha }}
          CATALOG_TAG: ${{ inputs.modules-tag }}
        run: |
          source_sha=$(git rev-parse --verify HEAD 2>/dev/null || printf '%s' "$CLIENT_REF")
          {
            printf '### %s\n\n%s\n\n' "$CHECK_NAME" "$CHECK_PURPOSE"
            printf 'Task: `%s` | Platform: %s | Status: %s\n\n' "$CHECK_TASK" "$CHECK_PLATFORM" "$CHECK_STATUS"
            printf 'Client source: `%s` | Selected catalog: `%s`\n' "$source_sha" "$CATALOG_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
