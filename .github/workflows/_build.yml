name: Native macOS builds

on:
  workflow_call:
    inputs:
      modules-tag:
        description: Module catalog tag to bundle.
        required: true
        type: string
      commit-sha:
        description: Commit SHA.
        required: false
        type: string
      release-tag:
        description: Binaries version.
        required: false
        type: string
      artifact-name:
        description: Prefix for binary names.
        required: false
        type: string
    outputs:
      artifact-name:
        description: Prefix for built binary names.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            name: macOS build - Apple Silicon (arm64)
          - arch: amd64
            runner: macos-26-intel
            name: macOS build - Intel (amd64)
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and sign macOS binary
        uses: mr-chelyshkin/actions/task-run@772ed02edbc40cbc539a507e0f55972da7cc7c8e # v3
        with:
          task: release/build
          args: |
            modules_version=${{ inputs.modules-tag }}
            TARGET_ARCH=${{ matrix.arch }}
            RELEASE_TAG=${{ inputs.release-tag }}
      - name: Verify binary starts
        run: bin/limanix-${{ matrix.arch }} --version
      - name: Scan macOS Go code for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Write checksum
        working-directory: bin
        run: shasum -a 256 limanix-${{ matrix.arch }} > limanix-${{ matrix.arch }}.sha256
      - name: Upload binary
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.arch }}
          path: |
            bin/limanix-${{ matrix.arch }}
            bin/limanix-${{ matrix.arch }}.sha256
          if-no-files-found: error
          overwrite: true
      - name: Summarize macOS build
        if: always()
        env:
          BUILD_NAME: ${{ matrix.name }}
          BUILD_PLATFORM: ${{ runner.os }} / ${{ runner.arch }}
          BUILD_STATUS: ${{ job.status }}
          TARGET_ARCH: ${{ matrix.arch }}
          CLIENT_REF: ${{ inputs.commit-sha || github.sha }}
          CATALOG_TAG: ${{ inputs.modules-tag }}
        run: |
          source_sha=$(git rev-parse --verify HEAD 2>/dev/null || printf '%s' "$CLIENT_REF")
          {
            printf '### %s\n\n' "$BUILD_NAME"
            printf 'Build and ad-hoc sign the macOS client, verify it starts, and scan macOS Go code for known vulnerabilities.\n\n'
            printf 'Task: `release/build TARGET_ARCH=%s` | Platform: %s | Status: %s\n\n' "$TARGET_ARCH" "$BUILD_PLATFORM" "$BUILD_STATUS"
            printf 'Client source: `%s` | Selected catalog: `%s`\n' "$source_sha" "$CATALOG_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
