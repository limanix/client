name: Build binaries

on:
  workflow_call:
    inputs:
      modules-tag:
        description: Explicit module catalog tag to bundle.
        required: true
        type: string
      commit-sha:
        description: Client source commit SHA.
        required: false
        type: string
      release-tag:
        description: Version embedded in the binaries.
        required: false
        type: string
      artifact-name:
        description: Prefix for binary artifact names.
        required: false
        type: string
    outputs:
      artifact-name:
        description: Prefix for built binary artifact names.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: amd64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binary
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          MODULES_TAG: ${{ inputs.modules-tag }}
        with:
          command: release/build modules_version="$MODULES_TAG" TARGET_ARCH=${{ matrix.arch }}
      - name: Upload binary
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.arch }}
          path: bin/limanix-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
