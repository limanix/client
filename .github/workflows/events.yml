name: Rebuild client with published catalog

on:
  repository_dispatch:
    types: [modules-release]

concurrency:
  group: release
  queue: max

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.versions.outputs.tags }}
      modules-tag: ${{ steps.catalog.outputs.modules-tag }}
    steps:
      - name: Check module tag
        uses: mr-chelyshkin/actions/tag-format-check@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          tag: ${{ github.event.client_payload.tag }}
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: limanix/modules
          ref: ${{ github.event.client_payload.tag }}
          fetch-depth: 0
          path: .cache/modules
          persist-credentials: false
      - name: Select published catalog
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES_TAG: ${{ github.event.client_payload.tag }}
        run: >-
          python3 -B .github/scripts/select_catalog.py --modules-root .cache/modules
          --modules-tag "$MODULES_TAG" >> "$GITHUB_OUTPUT"
      - name: Select client versions
        id: tags
        uses: mr-chelyshkin/actions/tag-list@577ea5b38e0b2ad2bffe7977574fda5e59657a60 # v2
        with:
          pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[1-9][0-9]*)?$'
          count: ${{ vars.RELEASE_COUNT }}
          ignore-build-metadata: 'true'
          require-release: 'true'
      - name: Set rebuild tags
        id: versions
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tags=$(jq -c 'map(.tag |= (
            split("+") | "\(.[0])+\((.[1] // "0" | tonumber) + 1)"
          ))' <<< "$TAGS")
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.tag }}
    needs: clients
    if: needs.clients.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.clients.outputs.tags) }}
    uses: ./.github/workflows/_publish.yml
    with:
      commit-sha: ${{ matrix.commit_sha }}
      release-tag: ${{ matrix.tag }}
      modules-tag: ${{ needs.clients.outputs.modules-tag }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
