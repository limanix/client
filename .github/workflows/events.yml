name: Events flow

on:
  repository_dispatch:
    types: [modules-release]

concurrency:
  group: release
  queue: max

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
      modules-tag: ${{ steps.catalog.outputs.modules-tag }}
    steps:
      - name: Check module tag
        uses: mr-chelyshkin/actions/check-tag-format@v1
        with:
          tag: ${{ github.event.client_payload.tag }}
          pattern: '^v[1-9][0-9]*$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: limanix/modules
          ref: ${{ github.event.client_payload.tag }}
          fetch-depth: 0
          path: .cache/modules
          persist-credentials: false
      - name: Select published catalog
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES_TAG: ${{ github.event.client_payload.tag }}
        run: >-
          python3 -B .github/scripts/select_catalog.py --modules-root .cache/modules
          --modules-tag "$MODULES_TAG" >> "$GITHUB_OUTPUT"
      - name: Test complete pair planning
        run: python3 -B -m unittest discover -s .github/scripts
      - name: Select client versions
        id: tags
        uses: mr-chelyshkin/actions/get-tags@v1
        with:
          pattern: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[1-9][0-9]*)?$'
          count: ${{ vars.RELEASE_COUNT }}
          ignore-build-metadata: 'true'
          require-release: 'true'
      - name: Set rebuild tags
        id: versions
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tags=$(jq -c 'map(.tag |= (
            split("+") | "\(.[0])+\((.[1] // "0" | tonumber) + 1)"
          ))' <<< "$TAGS")
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Plan each client and catalog pair
        id: plan
        env:
          MODULES_TAG: ${{ steps.catalog.outputs.modules-tag }}
          CLIENTS: ${{ steps.versions.outputs.tags }}
        run: >-
          python3 -B .github/scripts/plan_eval.py --modules-root .cache/modules
          --modules-tag "$MODULES_TAG" --clients-json "$CLIENTS" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.tag }}
    needs: clients
    if: needs.clients.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.clients.outputs.tags) }}
    uses: ./.github/workflows/_publish.yml
    with:
      commit-sha: ${{ matrix.commit_sha }}
      release-tag: ${{ matrix.tag }}
      modules-tag: ${{ needs.clients.outputs.modules-tag }}
      evaluation-matrix: ${{ toJSON(matrix.evaluation_matrix) }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  notify:
    needs: [clients, release]
    uses: ./.github/workflows/_notify.yml
    with:
      modules-tag: ${{ needs.clients.outputs.modules-tag }}
      clients: ${{ needs.clients.outputs.tags }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
