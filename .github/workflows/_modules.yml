name: Select module catalog

on:
  workflow_call:
    outputs:
      tag:
        description: Selected published module catalog tag.
        value: ${{ jobs.modules.outputs.tag }}

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.modules.outputs.tag }}
    steps:
      - name: Check out module tags
        uses: actions/checkout@v6
        with:
          repository: limanix/modules
          fetch-depth: 0
          persist-credentials: false
      - name: Select the latest published module tag
        id: tags
        uses: mr-chelyshkin/actions/get-tags@v1
        with:
          repository: limanix/modules
          pattern: 'v[0-9]*'
          require-release: 'true'
          count: '1'
          sort: desc
      - name: Check out client automation
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Read the selected module tag
        id: modules
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: python3 scripts/release.py modules
      - name: Verify the module release
        env:
          GH_TOKEN: ${{ github.token }}
          MODULES_TAG: ${{ steps.modules.outputs.tag }}
        run: python3 scripts/release.py verify-modules
